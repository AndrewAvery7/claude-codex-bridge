name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger exists so the Healthchecks wiring below can be proven without
  # waiting a week for the cron.
  workflow_dispatch:
  # Weekly re-run: re-validates the suite against fresh runner images and
  # toolchains even when the repo is untouched, and keeps the public Actions
  # history a living record rather than a snapshot of the last push. (GitHub
  # pauses scheduled workflows after ~60 days without repo activity.)
  schedule:
    - cron: "43 11 * * 1"

jobs:
  # The engine is cross-platform, so prove it on all three OSes rather than
  # claiming it. The Windows-specific path rules are pure functions and are
  # tested everywhere by reloading the module with sys.platform patched.
  engine:
    name: engine (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test deps
        run: python -m pip install --upgrade pip pytest
      - name: Unit tests
        run: python -m pytest tests/ -q
      - name: Engine imports and self-reports on this platform
        run: python plugins/codex-bridge/scripts/codex_bridge.py doctor
      - name: CLI surface is intact
        shell: bash
        run: |
          python plugins/codex-bridge/scripts/codex_bridge.py --help
          for c in transfer pick sync doctor; do
            python plugins/codex-bridge/scripts/codex_bridge.py "$c" --help > /dev/null
            echo "  ok: $c"
          done
      - name: Refuses a source outside ~/.claude/projects
        shell: bash
        run: |
          # Must fail (importer requirement), and must fail cleanly, not crash.
          if python plugins/codex-bridge/scripts/codex_bridge.py transfer \
               --source "$PWD/README.md" --open none; then
            echo "expected a non-zero exit for an invalid source"; exit 1
          fi
          echo "  ok: rejected invalid source"

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile check
        run: |
          python -m py_compile \
            plugins/codex-bridge/scripts/codex_bridge.py \
            plugins/codex-bridge/scripts/codex-thread-query.py \
            tools/make-promo.py \
            tests/test_codex_bridge.py

  lint-powershell:
    name: powershell (Windows GUI launcher)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path plugins/codex-bridge/scripts -Recurse -Severity Error
          $results | Format-Table -AutoSize
          if ($results.Count -gt 0) { exit 1 }
      - name: PowerShell 5.1 parse check
        shell: powershell
        run: |
          $errs = @()
          Get-ChildItem plugins/codex-bridge/scripts/*.ps1 | ForEach-Object {
            $t = $null; $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$t, [ref]$e)
            if ($e.Count -gt 0) { $errs += "$($_.Name): $($e[0].Message)" }
          }
          if ($errs) { $errs | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host "All scripts parse under Windows PowerShell 5.1"
      - name: ASCII guard (PS 5.1 reads BOM-less UTF-8 as ANSI)
        shell: pwsh
        run: |
          $bad = Get-ChildItem plugins/codex-bridge/scripts/*.ps1 | Where-Object {
            @([System.IO.File]::ReadAllBytes($_.FullName) | Where-Object { $_ -gt 127 }).Count -gt 0
          }
          if ($bad) { $bad | ForEach-Object { Write-Error "Non-ASCII bytes in $($_.Name)" }; exit 1 }
          Write-Host "All .ps1 files are pure ASCII"

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck the tooling scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -S error tools/*.sh

  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JSON validity and version agreement
        run: |
          python - <<'PY'
          import json, sys
          mk = json.load(open('.claude-plugin/marketplace.json'))
          pl = json.load(open('plugins/codex-bridge/.claude-plugin/plugin.json'))
          entry = next(p for p in mk['plugins'] if p['name'] == pl['name'])
          assert entry['version'] == pl['version'], (
              f"version mismatch: marketplace {entry['version']} != plugin {pl['version']}")
          assert mk['metadata']['version'] == pl['version'], (
              f"marketplace metadata {mk['metadata']['version']} != plugin {pl['version']}")
          print(f"manifests valid and agree on version {pl['version']}")
          PY

  # Dead-man's-switch for the weekly schedule. The note at the top of this file
  # already records that GitHub pauses scheduled workflows after ~60 days of
  # repo inactivity -- but knowing it and detecting it are different things, and
  # nothing here detected it. A paused cron looks exactly like a quiet week.
  #
  # Gated to schedule and manual runs deliberately: pinging on push would keep
  # the check green off the back of ordinary commits while the cron sat paused,
  # hiding the one fault this job exists to surface.
  ping:
    name: report the weekly run to Healthchecks
    needs: [engine, lint-python, lint-powershell, shellcheck, validate-manifests]
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        env:
          HC_PING_KEY: ${{ secrets.HC_PING_KEY }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [ -z "${HC_PING_KEY:-}" ]; then
            echo "HC_PING_KEY not configured - skipping ping."
            exit 0
          fi
          suffix=""
          if [ "$FAILED" = "true" ]; then suffix="/fail"; fi
          # Never fail the run over its own monitoring.
          curl -fsS -m 10 --retry 3 \
            "https://hc-ping.com/${HC_PING_KEY}/codex-bridge-weekly-ci${suffix}" \
            || echo "Healthchecks ping failed - not failing the run over it."
